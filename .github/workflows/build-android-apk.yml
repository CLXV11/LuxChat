name: Build LuxChat Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_DOMAIN: luxury-chat-hub--faddytu.replit.app

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract LuxChat source
        run: tar -xzf luxchat-source.tar.gz

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Build release APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luxchat-android-apk
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
