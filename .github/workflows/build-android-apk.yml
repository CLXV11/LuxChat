name: Build LuxChat Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_DOMAIN: luxury-chat-hub--faddytu.replit.app
  NODE_ENV: production
  CI: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract LuxChat source
        run: tar -xzf luxchat-source.tar.gz

      - name: Clean index.tsx invisible characters
        run: |
          if [ -f "artifacts/mobile/app/index.tsx" ]; then
            sed -i '1s/^\xEF\xBB\xBF//' artifacts/mobile/app/index.tsx
            sed -i '1s/^[[:space:]]*//' artifacts/mobile/app/index.tsx
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Prebuild Expo Mobile Project
        working-directory: artifacts/mobile
        run: |
          pnpm install
          npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luxchat-android-apk
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
